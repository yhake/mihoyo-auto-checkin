# ╭────────────────────────────────────────────╮
# │  ✨ 每日自动签到 · Daily Check-in ✨        │
# ╰────────────────────────────────────────────╯
name: 🎯 Daily Check-in

on:
  workflow_dispatch:          # 🚀 手动触发
  schedule:
     - cron: '5 16 * * *'      # 🕒 每天 16:05 UTC (00:05 UTC+8)

permissions:
  contents: read              # 📁 仅读取仓库代码

jobs:
  checkin:
    name: 🪄 Run Check-in
    runs-on: ubuntu-latest

    steps:
      # 📥 拉取仓库源码
      - name: 📦 Checkout source
        uses: actions/checkout@v4

      # 🐍 安装 Python 3.10
      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 📦 安装依赖
      - name: 🧩 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 🚀 执行签到脚本
      - name: 🏃‍♂️ Execute check-in
        run: python main.py
        env:
          cookie: ${{ secrets.COOKIE }}   # 🍪 用户 Cookie
          stoken: ${{ secrets.STOKEN }}   # 🔑 登录态 Token
          CAPTCHA_ENDPOINT: ${{ secrets.CAPTCHA_ENDPOINT }}  # 🔑 验证码 API 端点
        continue-on-error: true  # 即使失败也继续发送通知

      # ===== 新增：生成 push.ini =====
      - name: 🔧 Generate push.ini
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
        run: |
          # 确保 config 目录存在
          mkdir -p config
          # 从模板复制
          cp config/push.ini config/push.ini.tmp 2>/dev/null || true
          # 直接使用您已有的 push.ini 作为模板，替换占位符
          sed -i "s|{{FEISHU_WEBHOOK}}|$FEISHU_WEBHOOK|g" config/push.ini
          sed -i "s|{{WECHAT_WEBHOOK}}|$WECHAT_WEBHOOK|g" config/push.ini
          # 可选：查看生成后的文件（调试用，建议注释掉）
          # cat config/push.ini

      # ===== 新增：调用 push.py 发送通知 =====
      - name: 📢 Send notification via push.py
        if: always()
        run: |
          # 确定状态码（0: 成功, 1: 失败）
          if [ "${{ job.status }}" == "success" ]; then
            STATUS=0
          else
            STATUS=1
          fi
          # 构建消息内容（可从日志中提取更多细节）
          MESSAGE="签到任务已完成，详情请查看 GitHub Actions 日志。"
          # 调用 push 函数
          python -c "from push import push; push($STATUS, '$MESSAGE')"
