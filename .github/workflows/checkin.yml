# ╭────────────────────────────────────────────╮
# │  ✨ 每日自动签到 · Daily Check-in ✨        │
# ╰────────────────────────────────────────────╯
name: 🎯 Daily Check-in

on:
  workflow_dispatch:          # 🚀 手动触发
  schedule:
     - cron: '5 16 * * *'      # 🕒 每天 16:05 UTC (00:05 UTC+8)

permissions:
  contents: read              # 📁 仅读取仓库代码

jobs:
  checkin:
    name: 🪄 Run Check-in
    runs-on: ubuntu-latest

    steps:
      # 📥 拉取仓库源码
      - name: 📦 Checkout source
        uses: actions/checkout@v4

      # 🐍 安装 Python 3.10
      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 📦 安装依赖
      - name: 🧩 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 🚀 执行签到脚本
      - name: 🏃‍♂️ Execute check-in
        run: python main.py
        env:
          cookie: ${{ secrets.COOKIE }}   # 🍪 用户 Cookie
          stoken: ${{ secrets.STOKEN }}   # 🔑 登录态 Token
          CAPTCHA_ENDPOINT: ${{ secrets.CAPTCHA_ENDPOINT }}  # 🔑 验证码 API 端点
        continue-on-error: true  # 即使失败也继续发送通知

      # ===== 新增：生成 push.ini =====
      - name: 🔧 Generate push.ini
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
        run: |
          mkdir -p config
          # 如果模板文件是 config/push.template.ini，则用这个；如果是 config/push.ini 直接修改
          if [ -f config/push.template.ini ]; then
            cp config/push.template.ini config/push.ini
          fi
          sed -i "s|{{FEISHU_WEBHOOK}}|$FEISHU_WEBHOOK|g" config/push.ini
          sed -i "s|{{WECHAT_WEBHOOK}}|$WECHAT_WEBHOOK|g" config/push.ini

      # ===== 执行签到（内部会自动推送）=====
      - name: 🏃‍♂️ Execute check-in
        run: python main.py
        env:
          cookie: ${{ secrets.COOKIE }}
          stoken: ${{ secrets.STOKEN }}
          CAPTCHA_ENDPOINT: ${{ secrets.CAPTCHA_ENDPOINT }}
