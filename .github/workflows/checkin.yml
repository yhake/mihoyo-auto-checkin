# ╭────────────────────────────────────────────╮
# │  ✨ 每日自动签到 · Daily Check-in ✨        │
# ╰────────────────────────────────────────────╯
name: 🎯 Daily Check-in

on:
  workflow_dispatch:          # 🚀 手动触发
  schedule:
     - cron: '5 16 * * *'      # 🕒 每天 16:05 UTC (00:05 UTC+8)

permissions:
  contents: read              # 📁 仅读取仓库代码

jobs:
  checkin:
    name: 🪄 Run Check-in
    runs-on: ubuntu-latest

    steps:
      # 📥 拉取仓库源码
      - name: 📦 Checkout source
        uses: actions/checkout@v4

      # 🐍 安装 Python 3.10
      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 📦 安装依赖
      - name: 🧩 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 🚀 执行签到脚本
      - name: 🏃‍♂️ Execute check-in
        run: python main.py
        env:
          cookie: ${{ secrets.COOKIE }}   # 🍪 用户 Cookie
          stoken: ${{ secrets.STOKEN }}   # 🔑 登录态 Token
          CAPTCHA_ENDPOINT: ${{ secrets.CAPTCHA_ENDPOINT }}  # 🔑 验证码 API 端点
        continue-on-error: true  # 即使失败也继续发送通知

      # 🤖 双机器人通知（飞书 + 企业微信）
      - name: 📢 Send notifications to Feishu & WeChat Work
        if: always()  # 无论成功还是失败都发送通知
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}    # 飞书机器人 Webhook
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}    # 企业微信机器人 Webhook
          JOB_STATUS: ${{ job.status }}                     # 任务执行状态
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_NAME: ${{ github.repository }}               # 仓库名称
          ACTOR: ${{ github.actor }}                        # 触发用户
        run: |
          # ==================== 设置状态信息 ====================
          if [ "$JOB_STATUS" = "success" ]; then
            STATUS_EMOJI="✅"
            STATUS_TEXT="签到成功 🎉"
            STATUS_COLOR="green"
          else
            STATUS_EMOJI="❌"
            STATUS_TEXT="签到失败 ⚠️ 请检查 Cookie 是否过期"
            STATUS_COLOR="red"
          fi
          
          CURRENT_TIME=$(date '+%Y-%m-%d %H:%M:%S')
          
          echo "=========================================="
          echo "📢 开始发送通知..."
          echo "签到状态: $STATUS_TEXT"
          echo "执行时间: $CURRENT_TIME"
          echo "=========================================="
          
          # ==================== 飞书通知（卡片格式） ====================
          if [ -n "$FEISHU_WEBHOOK" ]; then
            echo "📤 发送飞书通知..."
            
            FEISHU_MSG=$(cat <<EOF
          {
            "msg_type": "interactive",
            "card": {
              "header": {
                "title": {
                  "content": "${STATUS_EMOJI} 米游社签到通知",
                  "tag": "plain_text"
                },
                "template": "${STATUS_COLOR}"
              },
              "elements": [
                {
                  "tag": "div",
                  "text": {
                    "content": "**📊 签到状态**：${STATUS_TEXT}\n**⏰ 执行时间**：${CURRENT_TIME}\n**📦 仓库名称**：${REPO_NAME}\n**👤 触发用户**：${ACTOR}\n\n[🔗 点击查看运行详情](${RUN_URL})",
                    "tag": "lark_md"
                  }
                }
              ]
            }
          }
          EOF
          )
            
            curl -X POST "$FEISHU_WEBHOOK" \
              -H "Content-Type: application/json" \
              -d "$FEISHU_MSG" \
              --connect-timeout 10 \
              --max-time 30 \
              -w "\n✅ 飞书通知发送完成\n"
          else
            echo "⚠️ 未配置 FEISHU_WEBHOOK，跳过飞书通知"
          fi
          
          # ==================== 企业微信通知（Markdown格式） ====================
          if [ -n "$WECHAT_WEBHOOK" ]; then
            echo "📤 发送企业微信通知..."
            
            WECHAT_MSG=$(cat <<EOF
          {
            "msgtype": "markdown",
            "markdown": {
              "content": "${STATUS_EMOJI} **米游社签到通知**\n\n> **📊 状态**：${STATUS_TEXT}\n> **⏰ 时间**：${CURRENT_TIME}\n> **📦 仓库**：${REPO_NAME}\n> **👤 触发者**：${ACTOR}\n\n[🔗 查看运行详情](${RUN_URL})"
            }
          }
          EOF
          )
            
            curl -X POST "$WECHAT_WEBHOOK" \
              -H "Content-Type: application/json" \
              -d "$WECHAT_MSG" \
              --connect-timeout 10 \
              --max-time 30 \
              -w "\n✅ 企业微信通知发送完成\n"
          else
            echo "⚠️ 未配置 WECHAT_WEBHOOK，跳过了企业微信通知"
          fi
          
          echo "=========================================="
          echo "✅ 所有通知发送完毕"
          echo "=========================================="
